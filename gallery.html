<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery — Bloom Beauty Salon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span>Bloom</span></a>
      <nav class="nav" id="mainNav">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a class="active" href="gallery.html">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle4" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main class="container gallery-page">
    <h1>Gallery</h1>
    <p>Examples of our recent work.</p>

    <div class="filter-buttons mb-4 text-center fade-in">
      <button class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="manicure">Manicure</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="hair">Hair</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="spa">Spa</button>
    </div>

    <section class="gallery-grid fade-in">
      <figure class="gallery-item" data-category="manicure">
        <img src="gallery/extension.jpg" alt="Nail Extension" loading="lazy">
      </figure>

      <figure class="gallery-item" data-category="hair">
        <img src="gallery/classidcoloring.jpg" alt="Hair Coloring" loading="lazy">
      </figure>

      <figure class="gallery-item" data-category="manicure">
        <img src="gallery/classicmanicure.jpg" alt="Classic Manicure" loading="lazy">
      </figure>

      <figure class="gallery-item" data-category="spa">
        <img src="gallery/spa.avif" alt="Spa Treatment" loading="lazy">
      </figure>

      <figure class="gallery-item" data-category="hair">
        <img src="gallery/balayage.jpg" alt="Balayage" loading="lazy">
      </figure>

      <figure class="gallery-item" data-category="manicure">
        <img src="gallery/pedicure.jpg" alt="Pedicure" loading="lazy">
      </figure>
    </section>
  </main>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="" alt="">
    <div class="lightbox-controls">
      <span class="prev">&#10094;</span>
      <span class="next">&#10095;</span>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p><strong>Bloom Beauty Salon</strong></p>
        <p>Tel: +7 (727) 123-4567 · Address: Abai Ave, Almaty</p>
      </div>
      <div class="social">
        <a href="https://www.instagram.com/" aria-label="Instagram">IG</a>
        <a href="https://www.facebook.com/?locale=ru_RU" aria-label="Facebook">FB</a>
      </div>
    </div>
    <div class="container copyright">
      <p>© 2025 Beauty Salon Project</p>
    </div>
  </footer>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
